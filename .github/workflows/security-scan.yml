# ==============================================================================
# GitHub Actions CI/CD Pipeline — Security-First
# ==============================================================================
#
# WHY CI/CD FOR A SECURITY PROJECT?
#   Manual reviews miss things. Automated scanning catches:
#   - Secrets accidentally committed to git
#   - Vulnerable Docker base images
#   - Code with SQL injection, hardcoded passwords, etc.
#   - Misconfigured infrastructure (Terraform)
#
# PIPELINE STAGES:
#   1. Secret Detection:   Catch credentials before they reach GitHub
#   2. SAST:               Static code analysis (Semgrep)
#   3. Docker Scan:        Vulnerability scan of container images (Trivy)
#   4. Terraform Lint:     Infrastructure code quality
#   5. Security Test:      Run the actual security test suite
#
# ==============================================================================

name: Security CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ============================================================================
  # JOB 1: Secret Detection
  # ============================================================================
  # WHY scan for secrets in git?
  # People accidentally commit API keys, passwords, and tokens every day.
  # Once pushed, they're in git history forever (even if deleted from HEAD).
  # GitLeaks scans every commit in the PR for credential patterns.
  secret-detection:
    name: "Secret Detection (GitLeaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history — scan all commits, not just latest

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # JOB 2: Static Application Security Testing (SAST)
  # ============================================================================
  # WHY Semgrep?
  # Semgrep understands code semantics, not just text patterns.
  # It can detect:
  #   - SQL injection (even multi-line, with string interpolation)
  #   - Hardcoded passwords in code
  #   - Insecure random number generation
  #   - Missing authentication on routes
  # The "p/owasp-top-ten" ruleset covers the OWASP Top 10 vulnerabilities.
  sast:
    name: "SAST (Semgrep)"
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep OWASP Top 10
        run: semgrep --config=p/owasp-top-ten --config=p/python --error --json > semgrep-results.json
        continue-on-error: true  # Report but don't block on first run

      - name: Upload Semgrep results
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json

  # ============================================================================
  # JOB 3: Container Image Vulnerability Scanning
  # ============================================================================
  # WHY Trivy?
  # Docker images inherit vulnerabilities from their base layers.
  # python:3.12-slim might contain a vulnerable libssl version.
  # Trivy scans: OS packages, Python packages, and file system misconfigurations.
  #
  # CRITICAL severity = block the pipeline (CVE with CVSS ≥ 9.0)
  # HIGH severity = report but allow (will fix in next sprint)
  container-scan:
    name: "Container Scan (Trivy)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app image
        run: docker build -t zt-app:ci ./app

      - name: Scan app image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'zt-app:ci'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'  # Fail pipeline on CRITICAL vulnerabilities

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Scan nginx image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'owasp/modsecurity-crs:nginx-alpine'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '0'  # Report only for third-party images

  # ============================================================================
  # JOB 4: Terraform Validation and Security
  # ============================================================================
  terraform-security:
    name: "Terraform Lint + Security"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: Run Checkov (IaC Security Scanner)
        # WHY Checkov?
        # Checkov scans Terraform for misconfigurations:
        # - Containers running as root
        # - Networks not using internal=true for data tier
        # - Missing health checks
        # - Writable filesystems
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          quiet: true
          soft_fail: true  # Don't block on first run; review findings

  # ============================================================================
  # JOB 5: Dependency Vulnerability Check
  # ============================================================================
  dependency-check:
    name: "Python Dependency Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        working-directory: app
        run: pip-audit -r requirements.txt --format=json > audit-results.json || true

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-results
          path: app/audit-results.json

  # ============================================================================
  # JOB 6: Deploy (only on main branch, all jobs passed)
  # ============================================================================
  deploy:
    name: "Deploy"
    runs-on: ubuntu-latest
    needs: [secret-detection, sast, container-scan, terraform-security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production  # Requires manual approval in GitHub Environments settings
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        # WHY SSH deploy over GitHub Actions runner?
        # The runner is ephemeral — it can't maintain Vault tokens.
        # SSH to your server keeps secrets off the runner.
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/zero-trust-architecture
            git pull origin main
            cd terraform
            terraform apply -auto-approve
            cd ../scripts
            ./security-test.sh
