name: Security CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  secret-detection:
    name: "Secret Detection (GitLeaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: "SAST (Semgrep)"
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep OWASP Top 10
        run: semgrep --config=p/owasp-top-ten --config=p/python --json > semgrep-results.json
        continue-on-error: true
      - name: Upload Semgrep results
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json

  container-scan:
    name: "Container Scan (Trivy)"
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # Required for uploading SARIF
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build app image
        run: docker build -t zt-app:ci ./app

      - name: Scan app image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
         image-ref: zt-app:ci
         format: sarif
         output: trivy-results.sarif
         severity: CRITICAL,HIGH
         exit-code: '0'
# Set to '1' if you want the pipeline to fail on findings

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Scan nginx base image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: owasp/modsecurity-crs:nginx-alpine
          format: table
          severity: CRITICAL
          exit-code: '0'

  terraform-security:
    name: "Terraform Lint + Security"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive
      - name: Terraform Validate
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          quiet: true
          soft_fail: true

  dependency-check:
    name: "Python Dependency Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies
        working-directory: app
        run: pip-audit -r requirements.txt --format=json > audit-results.json || true
      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-results
          path: app/audit-results.json

  deploy:
    name: "Deploy"
    runs-on: ubuntu-latest
    needs: [secret-detection, sast, container-scan, terraform-security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "::error::Missing DEPLOY_HOST secret in the production environment"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "::error::Missing DEPLOY_USER secret in the production environment"; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "::error::Missing DEPLOY_SSH_KEY secret in the production environment"; exit 1; }
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/zero-trust-architecture
            git pull origin main
            docker compose up -d --build
            docker compose ps
            cd scripts
            ./security-test.sh
