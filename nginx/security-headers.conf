# ==============================================================================
# HTTP Security Headers
# ==============================================================================
# Include this file in every server block: include conf.d/security-headers.conf
#
# WHY EACH HEADER? Explained below.
# These headers are invisible to users but critical to security.
# Without them, browsers allow a class of attacks that headers prevent.
# ==============================================================================

# ------------------------------------------------------------------------------
# Strict-Transport-Security (HSTS)
# WHY? Tells browsers: "only ever connect to this site over HTTPS — forever."
# Without HSTS, an attacker on the same network can intercept HTTP requests
# before the server redirects them to HTTPS (SSL stripping attack).
# max-age=31536000 = 1 year. includeSubDomains protects all subdomains.
# preload = submit to browser preload list (hardcoded HTTPS-only in browsers).
# ------------------------------------------------------------------------------
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# ------------------------------------------------------------------------------
# Content-Security-Policy (CSP)
# WHY? Prevents Cross-Site Scripting (XSS) by controlling what scripts can run.
# Without CSP, injected <script> tags execute with full page privileges.
# This policy only allows resources from the same origin (self).
# Adjust based on your CDN and third-party scripts.
# ------------------------------------------------------------------------------
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# ------------------------------------------------------------------------------
# X-Frame-Options
# WHY? Prevents clickjacking — attacker embeds your page in an <iframe>
# and tricks users into clicking buttons they can't see.
# DENY = never allow in any frame.
# ------------------------------------------------------------------------------
add_header X-Frame-Options "DENY" always;

# ------------------------------------------------------------------------------
# X-Content-Type-Options
# WHY? Prevents MIME-type sniffing.
# Without this, if you serve a JS file as text/plain, browsers may execute it.
# nosniff = always trust the Content-Type header, never guess.
# ------------------------------------------------------------------------------
add_header X-Content-Type-Options "nosniff" always;

# ------------------------------------------------------------------------------
# Referrer-Policy
# WHY? Controls how much URL information is sent when navigating to other sites.
# strict-origin-when-cross-origin = send full URL for same-origin, only hostname
# for cross-origin. Prevents leaking tokens in URLs to third-party analytics.
# ------------------------------------------------------------------------------
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# ------------------------------------------------------------------------------
# Permissions-Policy (formerly Feature-Policy)
# WHY? Disables browser features your app doesn't need.
# If XSS succeeds, the attacker can't access camera/microphone/geolocation
# because you've explicitly disabled those APIs.
# ------------------------------------------------------------------------------
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;

# ------------------------------------------------------------------------------
# Cross-Origin-Embedder-Policy / Opener-Policy / Resource-Policy
# WHY? Protects against Spectre-style side-channel attacks.
# These headers isolate your browsing context so attackers can't use
# high-resolution timers to infer data from other origins.
# ------------------------------------------------------------------------------
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# ------------------------------------------------------------------------------
# Cache-Control for sensitive endpoints
# WHY? Prevents browsers and proxies from caching responses that contain
# user data. Without this, logout doesn't truly log out if the browser
# serves a cached version of the dashboard.
# Set per-location as needed; this is the secure default for API endpoints.
# ------------------------------------------------------------------------------
# add_header Cache-Control "no-store, no-cache, must-revalidate" always;
