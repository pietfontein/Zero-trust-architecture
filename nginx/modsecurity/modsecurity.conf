# ==============================================================================
# ModSecurity Configuration — Web Application Firewall
# ==============================================================================
#
# WHY ModSecurity?
#   ModSecurity is the most widely-deployed open-source WAF in the world.
#   It's used by enterprise companies as the engine behind commercial products
#   like AWS WAF and Cloudflare WAF. The OWASP Core Rule Set (CRS) is the
#   standard ruleset used across the industry.
#
# HOW IT WORKS:
#   1. Every incoming request is scored against ~300 rules
#   2. Rules detect patterns like SQL injection, XSS, path traversal, RFI
#   3. If the anomaly score exceeds the threshold (ANOMALY_INBOUND), block it
#   4. Log the blocked request for investigation
#
# PARANOIA LEVELS (controlled by PARANOIA env var in docker-compose.yml):
#   1 = Low false positives. Good for starting out.
#   2 = Recommended production level. Balanced.
#   3 = High security. Expect some false positives.
#   4 = Maximum. Designed for high-security environments only.
#
# ==============================================================================

# Enable ModSecurity engine
SecRuleEngine On

# WHY DetectionOnly during testing?
# Switch to "On" for production, "DetectionOnly" while tuning rules.
# DetectionOnly logs but doesn't block — lets you see what would be blocked.
# SecRuleEngine DetectionOnly

# ===========================================================================
# REQUEST BODY INSPECTION
# ===========================================================================
# WHY? Without this, POST body contents are invisible to the WAF.
# SQL injection via JSON body: {"user": "admin' OR 1=1 --"}
# The WAF must read the body to detect this.
SecRequestBodyAccess On
SecRequestBodyLimit 13107200    # 12.5 MB max request body
SecRequestBodyNoFilesLimit 131072  # 128KB for non-file fields

# WHY reject, not drop?
# Reject returns 413 Payload Too Large — the client knows what happened.
# Drop silently closes the connection — harder to debug for legitimate users.
SecRequestBodyLimitAction Reject

# ===========================================================================
# RESPONSE BODY INSPECTION
# ===========================================================================
# WHY inspect responses?
# Detect data leakage — error messages exposing SQL queries, stack traces,
# internal IPs, or credit card numbers in responses.
SecResponseBodyAccess On
SecResponseBodyLimit 524288     # 512KB — inspect first 512KB of response
SecResponseBodyMimeType text/plain text/html text/xml application/json

# ===========================================================================
# LOGGING
# ===========================================================================
# Log all blocked requests to this file
SecAuditLog /var/log/nginx/modsecurity-audit.log
SecAuditLogFormat JSON          # JSON for easy parsing with log aggregators
SecAuditLogParts ABIJDEFHZ      # Which request parts to log

# WHY log request/response data?
# Security incidents require forensic analysis. Without logging the actual
# attack payload, you can't understand what was attempted.

# Log only relevant events (not every request — that's too much)
SecAuditEngine RelevantOnly
# What counts as "relevant"? Anything above status 400
SecAuditLogRelevantStatus "^(?:5|4(?!04))"

# ===========================================================================
# RULES EXCLUSIONS
# ===========================================================================
# Some rules generate false positives for specific endpoints.
# Add exclusions here rather than lowering the paranoia level globally.

# Example: Exclude the /api/upload endpoint from body size restrictions
# SecRule REQUEST_URI "@beginsWith /api/upload" \
#     "id:1000,phase:1,pass,nolog,ctl:requestBodyLimit=104857600"

# Example: Exclude an admin endpoint from XSS rules (if it accepts HTML)
# SecRuleRemoveById 941100
