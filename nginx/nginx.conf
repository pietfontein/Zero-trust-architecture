# ==============================================================================
# Nginx Configuration — Zero-Trust Edge Proxy
# ==============================================================================
#
# WHY THESE SETTINGS?
# This file contains production-hardened Nginx config. Every directive is
# explained. Understanding *why* each setting exists is more important than
# copy-pasting the config.
#
# SECURITY LAYERS IN THIS FILE:
#   1. Rate limiting (request throttle by IP)
#   2. Connection limits (prevent connection exhaustion)
#   3. Request size limits (prevent large payload attacks)
#   4. Timeout settings (prevent slow-loris attacks)
#   5. Security headers (prevent browser-based attacks)
#   6. Information hiding (attacker can't fingerprint server version)
# ==============================================================================

load_module /usr/lib/nginx/modules/ngx_http_modsecurity_module.so;

# Number of worker processes.
# WHY auto? Nginx auto-detects CPU cores and spawns one worker per core.
# More workers = better parallelism for CPU-bound tasks.
worker_processes auto;
pid /tmp/nginx.pid;

# Maximum number of file descriptors per worker.
# WHY 65535? Each active connection uses a file descriptor.
# Default Linux limit is 1024 — too low for production.
worker_rlimit_nofile 65535;

events {
  # Max concurrent connections per worker.
  # WHY 1024? Safe default. Total connections = worker_processes × worker_connections.
  # 4 cores × 1024 = 4096 concurrent connections — more than enough for most apps.
  worker_connections 1024;

  # Accept multiple connections per epoll event.
  # WHY? Reduces system call overhead under high load.
  multi_accept on;

  # Use Linux's efficient I/O event notification.
  # WHY epoll? epoll scales to thousands of connections; select() does not.
  use epoll;
}

http {
  proxy_temp_path /tmp/proxy_temp;
  client_body_temp_path /tmp/client_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # ===========================================================================
  # SECURITY: Hide version information
  # ===========================================================================
  # WHY? Attackers search Shodan/CVE databases for "nginx/1.24.0" vulnerabilities.
  # Hiding the version raises the bar for automated attacks.
  server_tokens off;

  # Enable ModSecurity and the OWASP CRS generated by the container entrypoint.
  include /etc/nginx/conf.d/modsecurity.conf;


  # ===========================================================================
  # RATE LIMITING — Prevent abuse and DDoS
  # ===========================================================================
  # WHY rate limiting at the proxy, not the app?
  # The app server wastes CPU processing requests it will reject anyway.
  # Nginx blocks them at the edge before they reach your Python/Node code.

  # Define a rate limit zone: 10 requests/second per IP address
  # Zone name: "api_limit"
  # Storage: 10MB (stores ~160,000 unique IP addresses)
  # Rate: 10 requests per second (10r/s)
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

  # Stricter zone for auth endpoints (login, password reset)
  # WHY? Brute-force attacks target /login — 2 attempts/second per IP is generous
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;

  # Connection limit: max 20 simultaneous connections per IP
  # WHY? A browser needs 6-8 connections. 20 is generous for legitimate use.
  # More than 20 from one IP is almost always a DoS attempt or misconfigured crawler.
  limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

  # ===========================================================================
  # TIMEOUTS — Prevent slow-loris and lingering connections
  # ===========================================================================
  # WHY these specific values?
  # Slow-loris attack: attacker opens many connections and sends headers very slowly,
  # exhausting your worker pool. Low timeouts close idle connections quickly.

  client_body_timeout    12s;   # How long to wait for the request body
  client_header_timeout  12s;   # How long to wait for request headers
  keepalive_timeout      15s;   # How long to keep idle connections alive
  send_timeout           10s;   # How long to wait between sends to client

  # ===========================================================================
  # REQUEST SIZE LIMITS — Prevent large payload attacks
  # ===========================================================================
  # WHY? A 1GB file upload to your API endpoint could exhaust memory.
  # Set this based on your app's actual needs.
  client_max_body_size    10M;   # Max upload size
  client_body_buffer_size 128k;  # Buffer before writing to temp file

  # ===========================================================================
  # UPSTREAM — Load balance to private tier app servers
  # ===========================================================================
  # WHY least_conn over round-robin?
  # Round-robin ignores server load. If app_az1 is handling a slow request,
  # least_conn sends the next request to app_az2 instead.
  upstream app_servers {
    least_conn;

    # These hostnames resolve via Docker's internal DNS
    # WHY? Docker creates DNS entries for each service name.
    # "app_az1" resolves to the container's private IP on private_net.
    # This traffic NEVER leaves the host machine.
    server app_az1:5000 max_fails=3 fail_timeout=30s;
    server app_az2:5000 max_fails=3 fail_timeout=30s;

    # WHY max_fails + fail_timeout?
    # If app_az1 fails 3 times in 30 seconds, Nginx marks it as down
    # and sends all traffic to app_az2. This is the "high availability" behavior.
    # After 30 seconds, Nginx retries app_az1.
  }

  # ===========================================================================
  # SERVER BLOCK — Main virtual host
  # ===========================================================================
  server {
    listen 80;
    server_name _;  # Accept any hostname (use specific name in production)

    # Redirect HTTP → HTTPS in production
    # Uncomment and configure when you have TLS certificates:
    # return 301 https://$host$request_uri;

    # Apply rate limiting to ALL requests
    limit_req zone=api_limit burst=20 nodelay;
    # WHY burst=20? Allows a burst of 20 requests before enforcing the rate limit.
    # Without burst, a page with 15 assets would trigger the rate limiter.
    # With burst=20, the initial page load is allowed; sustained abuse is blocked.

    # Apply connection limit
    limit_conn conn_limit 20;

    # Include security headers for all responses
    include /etc/nginx/conf.d/security-headers.conf;

    # Health check endpoint — not rate limited, not logged
    location /health {
      access_log off;
      return 200 "healthy\n";
      add_header Content-Type text/plain;
    }

    # Auth endpoints — stricter rate limiting
    location ~ ^/(login|register|reset-password|forgot-password) {
      limit_req zone=auth_limit burst=5 nodelay;
      limit_req_status 429;  # Return 429 Too Many Requests (not 503)

      proxy_pass http://app_servers;
      include /etc/nginx/conf.d/proxy-params.conf;
    }

    # API endpoints
    location /api/ {
      limit_req zone=api_limit burst=50 nodelay;

      proxy_pass http://app_servers;
      include /etc/nginx/conf.d/proxy-params.conf;
    }

    # Block common attack paths — return 404 (not 403, don't confirm they exist)
    # WHY? Automated scanners probe /.env, /wp-admin, /phpmyadmin, etc.
    # Returning 404 instead of 403 gives less information to attackers.
    location ~ /\.(env|git|htaccess|htpasswd) {
      return 404;
    }
    location ~ ^/(wp-admin|wp-login|phpmyadmin|adminer|admin\.php) {
      return 404;
    }

    # Block requests with no User-Agent (most legitimate browsers send one)
    # WHY? This blocks ~60% of automated scanners with zero false positives.
    if ($http_user_agent = "") {
      return 444;  # Nginx's "close connection without response"
    }

    # All other requests
    location / {
      proxy_pass http://app_servers;
      include /etc/nginx/conf.d/proxy-params.conf;
    }

    # Deny direct access to internal paths
    location ~ ^/(metrics|debug|internal) {
      allow 172.21.0.0/24;  # private_net only
      deny all;
      proxy_pass http://app_servers;
    }
  }
}
